name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  # THE ESTATE FLOOR, defined once in dbhq-uk/.github (dbhq-uk/.github#4):
  # SKILL.md frontmatter parses as YAML and names its directory, plugin.json
  # parses and carries no version, skill paths are braced, every shell script
  # passes bash -n and shellcheck, ruff E9,F, and no em or en dashes. Pinned
  # by SHA; Dependabot moves the pin.
  #
  # The dash rule matters more here than anywhere: verve strips em dashes
  # from other people's prose, so shipping them in its own source undermines
  # the product. The floor exempts blockquoted markdown lines, which is what
  # lets references/examples.md quote machine-written passages verbatim as
  # the "before" half of a worked example.
  floor:
    uses: dbhq-uk/.github/.github/workflows/skill-floor.yml@af131df509f44eb9abfe8b37ad6299c11f496c5f
    with:
      # Scripts are held to the dash rule too, as they were before the floor.
      dash-files: "*.md *.sh *.py"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # This skill is prose: no scripts, no packages, no interpreter. That is a
      # claim people can check at a glance, so CI checks it too - a script
      # appearing here should be a deliberate decision, not a drift.
      - name: The skill stays code-free
        run: |
          found=$(find skills -name '*.py' -o -name '*.sh' -o -name '*.js' \
                  -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' \
                  -o -name 'requirements*.txt' -o -name 'package.json')
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Executable code found. This skill is instructions, not tooling."
            exit 1
          fi
          # A file with any execute bit set is a script whatever its name.
          execs=$(find skills -type f -perm /111)
          if [ -n "$execs" ]; then
            echo "$execs"
            echo "::error::Executable bit set under skills/. Instructions are not executable."
            exit 1
          fi
          echo "No code under skills/ - instructions only."

      # The corpus is the only thing in the repository that checks the skill
      # rather than describing it, so it is worth knowing it still loads. This
      # is the dry run: it parses corpus.toml, asserts every case actually
      # asserts something, and resolves every reference file SKILL.md names.
      # No API key and no spend - measuring for real is a manual run, and
      # evals/README.md says why.
      - name: The eval corpus loads
        run: python3 evals/run.py --dry-run

      # The fidelity judge needs a model, so only its inputs are checked here:
      # every fixture names a case with claims, every recorded output it
      # points at exists, and every prompt builds.
      - name: The judge's claims and fixtures load
        run: python3 evals/judge.py --dry-run

      # AND THE GRADER STILL GRADES, which the dry run does not check. Every
      # recorded run in evals/runs/ is graded against the current corpus here:
      # 9/9, 9/9, 13/13 and three runs of 19/19 as of 24 Sep 2026. The
      # runs in evals/runs/baseline/, sonnet-5/ and superseded/ are not graded:
      # the glob below does not recurse, deliberately, because they record
      # failures rather than runs that should pass.
      # No API key, no spend, no model
      # call - the outputs were written down when the run happened and grading
      # them is deterministic.
      #
      # What this catches is the failure the dry run cannot see: a corpus edit
      # that makes an assertion wrong rather than unparseable, or a grade.py
      # change that stops asserting. The corpus has been strengthened twice
      # since the first run and each time the recorded outputs were re-graded
      # by hand; this is that check, run every push instead of when remembered.
      #
      # --allow-missing is correct HERE and nowhere else. It skips, loudly, a
      # case that postdates the run being graded. evals/README.md says never to
      # use it on a fresh run, where a missing case is a missing test - so this
      # step must never be repointed at a new run without dropping the flag.
      - name: The recorded runs still grade against the current corpus
        run: |
          for run in evals/runs/*.json; do
            echo "::group::$run"
            python3 evals/grade.py "$run" --allow-missing
            echo "::endgroup::"
          done

      # The whole install story rests on SKILL.md naming its references by
      # relative path. A hardcoded ~/.claude/skills path works on the author's
      # machine and is wrong under both a Codex install and a plugin install -
      # which is exactly the bug that kept this skill Claude-only before it
      # moved here. Asserted rather than trusted, because it reappears every
      # time someone pastes a working command out of their own terminal.
      - name: No hardcoded install paths
        run: |
          if grep -rn '~/\.claude/skills\|\$HOME/\.claude/skills\|CLAUDE_SKILL_DIR' skills/; then
            echo "::error::Hardcoded install path or install-time variable found. Name files by relative path (references/x.md)."
            exit 1
          fi
          echo "No hardcoded install paths."

  installers:
    name: Installers actually install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The installers are how anyone outside the marketplace gets the skill,
      # so they are exercised rather than assumed. Each is run twice: once
      # clean, and once against a real directory it did not create, which it
      # must refuse rather than delete or nest a link inside. Then the Codex
      # copy is checked for every relative reference SKILL.md names, from the
      # installed location, so a reference renamed upstream cannot "install"
      # successfully and fail at first use.
      - name: Claude install
        run: |
          ./install.sh
          test -L "$HOME/.claude/skills/verve" || { echo "not a symlink"; exit 1; }
          test -f "$HOME/.claude/skills/verve/SKILL.md" || { echo "SKILL.md missing"; exit 1; }
          ./install.sh   # idempotent over its own symlink

      - name: Claude install refuses a real directory
        run: |
          rm -f "$HOME/.claude/skills/verve"
          mkdir -p "$HOME/.claude/skills/verve" && echo "somebody's edit" > "$HOME/.claude/skills/verve/SKILL.md"
          if ./install.sh; then echo "::error::installer replaced a directory it did not create"; exit 1; fi
          grep -q "somebody's edit" "$HOME/.claude/skills/verve/SKILL.md" || { echo "::error::user file was destroyed"; exit 1; }
          rm -rf "$HOME/.claude/skills/verve"

      - name: Codex install refuses somebody else's skill
        run: |
          mkdir -p "$HOME/.codex/skills/verve"
          echo "somebody else's skill" > "$HOME/.codex/skills/verve/SKILL.md"
          if ./install-codex.sh; then echo "::error::installer overwrote a SKILL.md it did not create"; exit 1; fi
          grep -q "somebody else's skill" "$HOME/.codex/skills/verve/SKILL.md" || { echo "::error::user file was destroyed"; exit 1; }
          rm -rf "$HOME/.codex/skills/verve"

      - name: Codex install, and every relative reference resolves
        run: |
          ./install-codex.sh
          target="$HOME/.codex/skills/verve"
          test -f "$target/SKILL.md" || { echo "SKILL.md missing"; exit 1; }
          test -L "$target/references" || { echo "references/ not a symlink"; exit 1; }
          cmp -s skills/verve/SKILL.md "$target/SKILL.md" || { echo "installed SKILL.md differs from source"; exit 1; }
          # Every references/ path SKILL.md names must exist beside the copy.
          fail=0
          count=0
          while IFS= read -r p; do
            count=$((count + 1))
            [ -e "$target/$p" ] || { echo "named reference does not exist: $target/$p"; fail=1; }
          done < <(grep -o 'references/[a-z0-9_-]*\.md' "$target/SKILL.md" | sort -u)
          [ "$count" -gt 0 ] || { echo "::error::SKILL.md names no references; the check ran on nothing"; exit 1; }
          echo "$count named references resolve"
          ./install-codex.sh   # idempotent over its own links
          exit $fail

      - name: No dangling symlinks after either install
        run: |
          found=$(find "$HOME/.claude/skills/verve/" "$HOME/.codex/skills/verve/" -xtype l 2>/dev/null || true)
          if [ -n "$found" ]; then echo "::error::dangling symlinks:"; echo "$found"; exit 1; fi
          echo "No dangling symlinks."

  # Single required check for branch protection. Adding a job above does not mean
  # remembering to add it to the protection rule - it only needs listing here.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - floor
      - validate
      - installers
    steps:
      - name: Fail if any job did not succeed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a job did not succeed"; exit 1; }
          done
