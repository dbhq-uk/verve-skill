version: 2
updates:
  # GitHub Actions only. There is deliberately no pip ecosystem here: the skill
  # has no requirements.txt and no Python at all since the optional commercial
  # engine was removed in July 2026. Nothing to keep up to date is the point,
  # not an omission.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
