# The judge's own test set.
#
# evals/judge.py is only worth running if it passes rewrites that kept their
# meaning and fails rewrites that did not. This file is that check:
# `python3 evals/judge.py --selftest` judges every fixture and fails if any
# verdict disagrees with `expect`.
#
# Fields:
#   id        unique, kebab-case
#   case      the corpus case whose source and claims are used
#   expect    "pass" or "fail"
#   run       for a pass fixture: a recorded run to take the output from
#   output    for a fail fixture: the distorted rewrite, written out
#   catches   for a fail fixture: what the judge must notice, for the reader
#
# The fail fixtures are the semantic mutations mutations.toml has listed since
# 10 Sep 2026 as invisible to substring checks, plus the real distortion the
# 8 Sep run shipped. Every one of them passes the substring grader.

# ---------------------------------------------------------------------------
# Rewrites that kept their meaning. Read by hand on 24 Sep 2026.
# ---------------------------------------------------------------------------

