# The fixed corpus.
#
# Every case states what must be true of the output, never what the output
# should be. There is no single correct rewrite, so asserting one would make
# the harness a style opinion rather than a check.
#
# Fields:
#   id                     unique, kebab-case
#   kind                   triage | fidelity | variety | audience
#   request                what the user asks, minus the text itself
#   text                   the input passage
#   unchanged              true if the output must match the input
#   must_survive           must appear verbatim, CASE-SENSITIVE. Identifiers,
#                          proper nouns, figures: anything constraint 2 covers
#   must_survive_any_case  must appear, case ignored. Ordinary vocabulary that
#                          legitimately changes case when a sentence is recast
#   must_go                must not appear, case ignored
#   must_match             case-insensitive regular expressions that must each
#                          match. A smoke check for content whose wording
#                          legitimately varies (an apology, a modality near a
#                          deadline). Matching proves a shape is present, not
#                          that the meaning is right - keep the semantic
#                          criterion in the why, and read the output
#   max_loss               largest share of the words a rewrite may cut, 0 to 1
#   why                    what this case protects, printed on failure
#
# Every case that is not a triage case also fails automatically if the input
# comes back whole. Without that, a case asserting only must_survive passes on
# a verbatim no-op, since every fact trivially survives text nobody touched.

# ---------------------------------------------------------------------------
# Triage. The skill must be able to decide to do nothing.
# ---------------------------------------------------------------------------

[[case]]
id = "triage-human-blog"
kind = "triage"
request = "verve this:"
unchanged = true
why = "Plainly human prose: opinions, uneven rhythm, a specific number, an aside. Rewriting it is the failure that is invisible because the output still looks like work."
text = """
I gave up on the migration script after the third attempt. Not because it \
didn't work, exactly, but because it worked differently every time I ran it, \
and I could not tell you now which of the four things I changed was the one \
that mattered. Somewhere around 2am I started keeping a text file of what I'd \
tried. That file is 340 lines long. It is the only artefact of that night I \
would defend.
"""

[[case]]
id = "triage-human-terse"
kind = "triage"
request = "verve this:"
unchanged = true
why = "Short, blunt, no tells. Terseness is not a tell, and a skill that pads this has misread doing nothing as doing nothing useful."
text = """
The build broke because someone bumped the base image. Pinned it back to \
3.19. It will break again the next time anyone runs the update job, and I have \
not fixed that.
"""

# ---------------------------------------------------------------------------
# Fidelity. Facts, figures, names and dates survive a rewrite.
# ---------------------------------------------------------------------------

[[case]]
id = "fidelity-figures-and-names"
kind = "fidelity"
request = "verve this:"
must_survive = [
  "1989",
  "Instituto Vasco de Estadística",
  "2.19 million",
  "1,438",
  "Eustat",
]
must_survive_any_case = ["three offices"]
must_go = ["testament to", "underscores", "evolving"]
max_loss = 0.5
max_gain = 0.5
why = "The failure that matters. A wordlist edit can introduce it quietly, and a rewrite that drops a figure has failed however well it reads. The tells are listed too, because a case asserting only survival passes on a rewrite that changed nothing."
text = """
Founded in 1989, the Instituto Vasco de Estadística stands as a testament to \
the Basque Country's commitment to independent data. Known as Eustat, it \
serves a population of 2.19 million and employs 1,438 people across three \
offices. Its work underscores the vital role that regional statistical bodies \
play in today's evolving policy landscape.
"""

[[case]]
id = "fidelity-dense-technical"
kind = "fidelity"
request = "verve this:"
must_survive = [
  "gateway.pool.perRequest",
  "dep-4471",
  "02:14",
  "83%",
  "20",
]
must_go = ["It is important to note", "each and every", "subsequently"]
max_loss = 0.5
max_gain = 0.5
why = "Constraint 2. Identifiers and config keys are terms, not wording, and a synonym swap here breaks the thing the reader has to act on. Case-sensitive on purpose: gateway.pool.perrequest is a different key, and a check that accepted it would assert the opposite of the rule."
text = """
It is important to note that the root cause was ultimately traced to the \
configuration flag gateway.pool.perRequest, which had been toggled to true. \
This meant that each and every request would acquire its own connection from \
a pool with a ceiling of 20. Beginning at 02:14, the pool was exhausted, and \
83% of requests subsequently failed. The deployment in question was dep-4471.
"""

# ---------------------------------------------------------------------------
# Variety. Convert conventions, never terms.
# ---------------------------------------------------------------------------

[[case]]
id = "variety-keeps-american-source"
kind = "variety"
request = "verve this:"
must_survive_any_case = ["color", "behavior", "organize"]
must_go = ["colour", "behaviour", "Delving", "holistic", "going forward"]
why = "The default changed in the varieties PR: an American source stays American. Silently Britishising somebody's finished prose is the unrequested edit constraint 1 exists to stop. These three are ordinary vocabulary rather than identifiers, so casing may legitimately change when a sentence is recast."
text = """
The color system was designed to organize our tokens in a way that reflects \
how the product actually behaves. Delving into the behavior of each component, \
it becomes clear that a more holistic approach is needed going forward.
"""

[[case]]
id = "variety-never-converts-code"
kind = "variety"
request = "verve this in British English:"
must_survive = ["background-color", "initialize(", "--optimize"]
must_go = ["background-colour", "initialise(", "--optimise", "In order to", "leverage"]
why = "The worst thing this feature could do. A CSS property is an identifier, not a spelling, and converting one breaks the code."
text = """
In order to leverage the theming system, you must first call initialize() and \
then pass the --optimize flag. The background-color property is set at build \
time, which is a key part of what makes the pipeline so robust.
"""

[[case]]
id = "variety-never-converts-proper-nouns"
kind = "variety"
request = "verve this in British English:"
must_survive = ["World Health Organization", "Department of Labor"]
must_go = ["World Health Organisation", "Department of Labour"]
why = "Names are names in every variety. Constraint 1 protects them and the conversion tables must not reach them."
text = """
The World Health Organization published its findings, which underscore the \
pivotal role of occupational data. The Department of Labor subsequently \
navigated a series of challenges in reconciling the two datasets.
"""

[[case]]
id = "variety-explicit-conversion-of-clean-prose"
kind = "variety"
request = "verve this in US English:"
must_survive_any_case = ["color", "organized"]
must_go = ["colour", "organised"]
why = "The ordering defect: triage must not return clean prose unchanged when the request is an explicit conversion. This text is plainly human and needs nothing except the variety it was asked for."
text = """
The colour palette took three weekends to settle. I organised the tokens by \
hue in the end, not by component, and I still think that was the right call - \
the component grouping fell apart the moment two components shared a shade.
"""

# ---------------------------------------------------------------------------
# Audience. Cut what this reader does not need, keep what they must act on.
# ---------------------------------------------------------------------------

[[case]]
id = "audience-drops-the-gloss-keeps-the-facts"
kind = "audience"
request = "verve this for our VP of Engineering, who ran the platform team for six years:"
must_survive = ["87%", "Redis", "Friday", "Infrastructure"]
must_survive_any_case = ["three additional nodes", "next week"]
must_match = [
  # "primary cluster" may legitimately be recast as "primary Redis cluster";
  # the fact that it is the primary cluster must survive in some wording.
  '\bprimary\b[^.!?]{0,40}\bcluster\b',
]
must_go = [
  "in-memory data store",
  "Basically",
  "I hope this makes sense",
  "You need to approve",
]
why = "Group F. The gloss and the upward instruction go; the numbers, the node count, the provisioning week and the deadline stay, because they are what she acts on. The unlisted-content holes this case used to have were demonstrated: a two-line output that dropped the nodes and the provisioning week passed it."
text = """
Thanks so much for your question! I completely understand that budget \
decisions like this can be difficult.

By way of background, Redis is an in-memory data store, which means it keeps \
data in RAM rather than on disk. This makes it very fast, but capacity is \
limited by available memory.

Basically, we're running out. We are at 87% memory on the primary cluster. \
You need to approve the three additional nodes by Friday so Infrastructure can \
provision them next week.

I hope this makes sense! Let me know if you have any questions.
"""

[[case]]
id = "audience-keeps-the-warmth"
kind = "audience"
request = "verve this for a customer whose invoice we got wrong:"
must_survive = ["£240", "Thursday", "Ms Achebe"]
must_go = ["I completely understand how frustrating", "at this point in time"]
must_match = [
  # An apology or acknowledgement is owed. This matches its usual shapes; a
  # reworded acknowledgement that uses none of these words is legitimate and
  # would need the pattern extended, and "we are not sorry" would match, so
  # the semantic criterion stays in the why.
  '\b(?:sorry|apolog(?:y|ies|ise|ize|ised|ized|ising|izing)|inconvenien)',
  # The refund should reach her account; a rewrite must not promise harder
  # than the source did. This only checks that a "should" sits near the
  # deadline - an unrelated "should" satisfies it, which is recorded as a
  # semantic counterexample in mutations.toml.
  '\bshould\b[^.!?]{0,80}\bThursday\b',
  # The letter opens as a letter to her. Structural: anchored at the start.
  '\A\s*Dear Ms Achebe,',
]
why = "The other direction. Brevity is not bluntness: an apology is owed here and cutting it entirely is a register failure, not concision - a bare 'Invoice error. £240 refunded.' passed this case before the must_match assertions existed. The salutation stays, and 'should reach' must not harden into a promise."
text = """
Dear Ms Achebe,

I completely understand how frustrating this must be, and I want you to assure \
you that we hear you and that your feedback is incredibly valuable to us.

I am writing to inform you that at this point in time we have identified an \
error in your most recent invoice. We have processed a refund in the amount of \
£240, which should reach your account by Thursday.

Please do not hesitate to reach out if you have any further questions.

Kind regards,
Billing
"""
