# The fixed corpus.
#
# Every case states what must be true of the output, never what the output
# should be. There is no single correct rewrite, so asserting one would make
# the harness a style opinion rather than a check.
#
# Fields:
#   id                     unique, kebab-case
#   kind                   triage | fidelity | variety | audience | overshare |
#                          tells | voice | detect | contact
#   request                what the user asks, minus the text itself
#   text                   the input passage
#   unchanged              true if the output must match the input
#   must_survive           must appear verbatim, CASE-SENSITIVE. Identifiers,
#                          proper nouns, figures: anything constraint 2 covers
#   must_survive_any_case  must appear, case ignored. Ordinary vocabulary that
#                          legitimately changes case when a sentence is recast
#   must_go                must not appear, case ignored
#   must_not_match         case-insensitive regular expressions that must not
#                          match anywhere. For a shape that has to be absent in
#                          any wording: a probability score, an invented "I"
#   must_match             case-insensitive regular expressions that must each
#                          match. A smoke check for content whose wording
#                          legitimately varies (an apology, a modality near a
#                          deadline). Matching proves a shape is present, not
#                          that the meaning is right - keep the semantic
#                          criterion in the why, and read the output
#   max_loss               largest share of the words a rewrite may cut, 0 to 1
#   why                    what this case protects, printed on failure
#
# Every case that is not a triage case also fails automatically if the input
# comes back whole. Without that, a case asserting only must_survive passes on
# a verbatim no-op, since every fact trivially survives text nobody touched.

# ---------------------------------------------------------------------------
# Triage. The skill must be able to decide to do nothing.
# ---------------------------------------------------------------------------

[[case]]
id = "triage-human-blog"
kind = "triage"
request = "verve this:"
unchanged = true
why = "Plainly human prose: opinions, uneven rhythm, a specific number, an aside. Rewriting it is the failure that is invisible because the output still looks like work."
text = """
I gave up on the migration script after the third attempt. Not because it \
didn't work, exactly, but because it worked differently every time I ran it, \
and I could not tell you now which of the four things I changed was the one \
that mattered. Somewhere around 2am I started keeping a text file of what I'd \
tried. That file is 340 lines long. It is the only artefact of that night I \
would defend.
"""

[[case]]
id = "triage-human-terse"
kind = "triage"
request = "verve this:"
unchanged = true
why = "Short, blunt, no tells. Terseness is not a tell, and a skill that pads this has misread doing nothing as doing nothing useful."
text = """
The build broke because someone bumped the base image. Pinned it back to \
3.19. It will break again the next time anyone runs the update job, and I have \
not fixed that.
"""

# ---------------------------------------------------------------------------
# Fidelity. Facts, figures, names and dates survive a rewrite.
# ---------------------------------------------------------------------------

[[case]]
id = "fidelity-figures-and-names"
kind = "fidelity"
request = "verve this:"
must_survive = [
  "1989",
  "Instituto Vasco de Estadística",
  "2.19 million",
  "1,438",
  "Eustat",
]
must_survive_any_case = ["three offices"]
must_go = ["testament to", "underscores", "evolving"]
max_loss = 0.5
max_gain = 0.5
why = "The failure that matters. A wordlist edit can introduce it quietly, and a rewrite that drops a figure has failed however well it reads. The tells are listed too, because a case asserting only survival passes on a rewrite that changed nothing."
text = """
Founded in 1989, the Instituto Vasco de Estadística stands as a testament to \
the Basque Country's commitment to independent data. Known as Eustat, it \
serves a population of 2.19 million and employs 1,438 people across three \
offices. Its work underscores the vital role that regional statistical bodies \
play in today's evolving policy landscape.
"""

[[case]]
id = "fidelity-dense-technical"
kind = "fidelity"
request = "verve this:"
must_survive = [
  "gateway.pool.perRequest",
  "dep-4471",
  "02:14",
  "83%",
  "20",
]
must_go = ["It is important to note", "each and every", "subsequently"]
max_loss = 0.5
max_gain = 0.5
why = "Constraint 2. Identifiers and config keys are terms, not wording, and a synonym swap here breaks the thing the reader has to act on. Case-sensitive on purpose: gateway.pool.perrequest is a different key, and a check that accepted it would assert the opposite of the rule."
text = """
It is important to note that the root cause was ultimately traced to the \
configuration flag gateway.pool.perRequest, which had been toggled to true. \
This meant that each and every request would acquire its own connection from \
a pool with a ceiling of 20. Beginning at 02:14, the pool was exhausted, and \
83% of requests subsequently failed. The deployment in question was dep-4471.
"""

[[case]]
id = "fidelity-rank-and-simultaneity"
kind = "fidelity"
request = "verve this:"
must_survive = ["Harlow Water", "2019"]
must_survive_any_case = ["only", "first", "weekly"]
must_match = [
  # The two series come out together. That claim lives in one word, and a
  # rewrite that cuts "simultaneously" as filler has changed what happens.
  '\b(?:simultaneous\w*|at once|at the same time|same time|together|alongside)\b',
]
must_go = ["stands as", "testament", "Notably", "Crucially"]
max_loss = 0.5
max_gain = 0.5
why = "A ranking or a claim that things happen at once is carried by a single word - only, first, simultaneously - and those are exactly the words a sweep for inflation cuts as emphasis. humanizer hit this as a reported bug (#212, fixed in 2.11.3). A rewrite that makes Harlow one of several utilities, or has it publish the two series at different times, reads fine and says something else."
text = """
Notably, Harlow Water stands as the only utility in the region that publishes \
its leak data weekly, and it was the first to do so, back in 2019. \
Crucially, it releases the raw meter readings and the cleaned series \
simultaneously, a testament to its commitment to transparency.
"""

# ---------------------------------------------------------------------------
# Variety. Convert conventions, never terms.
# ---------------------------------------------------------------------------

[[case]]
id = "variety-keeps-american-source"
kind = "variety"
request = "verve this:"
must_survive_any_case = ["color", "organize"]
must_match = [
  # "the behavior of each component" may legitimately become "how each
  # component behaves". The variety check is that nothing is Britishised,
  # which must_go carries; this only asserts the idea did not vanish.
  '\bbehav(?:ior|iors|es|e|ed|ing)\b',
]
must_go = ["colour", "behaviour", "Delving", "holistic", "going forward"]
why = "The default changed in the varieties PR: an American source stays American. Silently Britishising somebody's finished prose is the unrequested edit constraint 1 exists to stop. These are ordinary vocabulary rather than identifiers, so casing may legitimately change when a sentence is recast, and 'behavior' may become 'behaves'."
text = """
The color system was designed to organize our tokens in a way that reflects \
how the product actually behaves. Delving into the behavior of each component, \
it becomes clear that a more holistic approach is needed going forward.
"""

[[case]]
id = "variety-never-converts-code"
kind = "variety"
request = "verve this in British English:"
must_survive = ["background-color", "initialize(", "--optimize"]
must_go = ["background-colour", "initialise(", "--optimise", "In order to", "leverage"]
why = "The worst thing this feature could do. A CSS property is an identifier, not a spelling, and converting one breaks the code."
text = """
In order to leverage the theming system, you must first call initialize() and \
then pass the --optimize flag. The background-color property is set at build \
time, which is a key part of what makes the pipeline so robust.
"""

[[case]]
id = "variety-never-converts-proper-nouns"
kind = "variety"
request = "verve this in British English:"
must_survive = ["World Health Organization", "Department of Labor"]
must_go = ["World Health Organisation", "Department of Labour"]
why = "Names are names in every variety. Constraint 1 protects them and the conversion tables must not reach them."
text = """
The World Health Organization published its findings, which underscore the \
pivotal role of occupational data. The Department of Labor subsequently \
navigated a series of challenges in reconciling the two datasets.
"""

[[case]]
id = "variety-explicit-conversion-of-clean-prose"
kind = "variety"
request = "verve this in US English:"
must_survive_any_case = ["color", "organized"]
must_go = ["colour", "organised"]
why = "The ordering defect: triage must not return clean prose unchanged when the request is an explicit conversion. This text is plainly human and needs nothing except the variety it was asked for."
text = """
The colour palette took three weekends to settle. I organised the tokens by \
hue in the end, not by component, and I still think that was the right call - \
the component grouping fell apart the moment two components shared a shade.
"""

# ---------------------------------------------------------------------------
# Audience. Cut what this reader does not need, keep what they must act on.
# ---------------------------------------------------------------------------

[[case]]
id = "audience-drops-the-gloss-keeps-the-facts"
kind = "audience"
request = "verve this for our VP of Engineering, who ran the platform team for six years:"
must_survive = ["87%", "Redis", "Friday", "Infrastructure"]
must_survive_any_case = ["three additional nodes", "next week"]
must_match = [
  # "primary cluster" may legitimately be recast as "primary Redis cluster";
  # the fact that it is the primary cluster must survive in some wording.
  '\bprimary\b[^.!?]{0,40}\bcluster\b',
]
must_go = [
  "in-memory data store",
  "Basically",
  "I hope this makes sense",
  "You need to approve",
]
why = "Group F. The gloss and the upward instruction go; the numbers, the node count, the provisioning week and the deadline stay, because they are what she acts on. The unlisted-content holes this case used to have were demonstrated: a two-line output that dropped the nodes and the provisioning week passed it."
text = """
Thanks so much for your question! I completely understand that budget \
decisions like this can be difficult.

By way of background, Redis is an in-memory data store, which means it keeps \
data in RAM rather than on disk. This makes it very fast, but capacity is \
limited by available memory.

Basically, we're running out. We are at 87% memory on the primary cluster. \
You need to approve the three additional nodes by Friday so Infrastructure can \
provision them next week.

I hope this makes sense! Let me know if you have any questions.
"""

[[case]]
id = "audience-keeps-the-warmth"
kind = "audience"
request = "verve this for a customer whose invoice we got wrong:"
must_survive = ["£240", "Thursday", "Ms Achebe"]
must_go = ["I completely understand how frustrating", "at this point in time"]
must_match = [
  # An apology or acknowledgement is owed. This matches its usual shapes; a
  # reworded acknowledgement that uses none of these words is legitimate and
  # would need the pattern extended, and "we are not sorry" would match, so
  # the semantic criterion stays in the why.
  '\b(?:sorry|apolog(?:y|ies|ise|ize|ised|ized|ising|izing)|inconvenien)',
  # The refund should reach her account; a rewrite must not promise harder
  # than the source did. This only checks that a "should" sits near the
  # deadline - an unrelated "should" satisfies it, which is recorded as a
  # semantic counterexample in mutations.toml.
  '\bshould\b[^.!?]{0,80}\bThursday\b',
  # The letter opens as a letter to her. Structural: anchored at the start.
  '\A\s*Dear Ms Achebe,',
]
why = "The other direction. Brevity is not bluntness: an apology is owed here and cutting it entirely is a register failure, not concision - a bare 'Invoice error. £240 refunded.' passed this case before the must_match assertions existed. The salutation stays, and 'should reach' must not harden into a promise."
text = """
Dear Ms Achebe,

I completely understand how frustrating this must be, and I want you to assure \
you that we hear you and that your feedback is incredibly valuable to us.

I am writing to inform you that at this point in time we have identified an \
error in your most recent invoice. We have processed a refund in the amount of \
£240, which should reach your account by Thursday.

Please do not hesitate to reach out if you have any further questions.

Kind regards,
Billing
"""

# ---------------------------------------------------------------------------
# Overshare. Flag what the writer is giving away, without cutting it, and do
# not flag what the reader needs.
#
# A limitation these three cases share, recorded here rather than discovered
# later: the note verve prints is part of the output, so a must_survive string
# matches whether it appears in the body or only in the note. The checks below
# cannot tell those apart. Read the outputs.
# ---------------------------------------------------------------------------

[[case]]
id = "overshare-flags-without-cutting"
kind = "overshare"
request = "verve this:"
must_survive = ["Northwind", "6th", "two other deadlines"]
must_match = [
  # The note fired. Heading wording is fixed by SKILL.md's Output section.
  '(?m)^Overshare \(not cut\):',
]
must_go = [
  "I hope this helps",
  "reach out",
  "circle back",
]
why = "Group G flags, it does not cut. The other client, the date and the excuse must all still be in the text - a rewrite that helpfully removed them has failed the case by doing the very thing the group is forbidden to do on its own initiative. The tells go, because the humanisation still runs."
text = """
Hi Tom,

I hope this helps clarify things! Just circling back on the timeline question \
you raised.

I can start on the 6th, once the Northwind engagement wraps up. Apologies again \
for missing Friday - the spec landed late and I had two other deadlines that \
week.

Do reach out if you need anything further.
"""

[[case]]
id = "overshare-floor-holds"
kind = "overshare"
request = "verve this for the client:"
must_survive = ["14th", "three weeks"]
must_match = [
  # The slip is real, dated and outside the writer's control to absorb, so it
  # is information. Nothing in group G may fire on it.
  '\bslip\w*\b|\blate\b|\bdelay\w*\b',
]
must_go = [
  "Overshare",
  "at this point in time",
  "it is important to note that",
]
why = "The floor. A dated slip the client has to plan around is a risk they are carrying, so it is information and never an overshare. A flag raised here is the failure that matters most in this group: it teaches the writer to bury the thing the reader needed. The three-week figure and the date survive."
text = """
Hi,

It is important to note that at this point in time the integration work will \
slip. The vendor has not returned the credentials and we cannot start without \
them.

Realistically this puts delivery at the 14th rather than the end of the month, \
so roughly three weeks later than we planned. You will want to factor that into \
the go-live date.
"""

[[case]]
id = "overshare-cuts-on-request"
kind = "overshare"
request = "verve this and cut the oversharing:"
must_survive = ["6th"]
must_match = [
  # The cuts are named rather than made silently.
  '(?m)^Overshare \(cut\):',
]
must_go = [
  "Northwind",
  "pipeline is quiet",
  "flexible on rate",
]
why = "An explicit instruction is the only thing that licenses removing content, and it must still be named. The start date survives because it is what the reader acts on. The step 6 carve-out is what lets this pass: without it the readback scores every requested cut as an omission."
text = """
Hi Tom,

Thanks for coming back to me so quickly on this one.

I can start on the 6th, once the Northwind engagement wraps up. I have capacity \
from then and honestly the pipeline is quiet, so I can be flexible on rate if \
that helps move things along.

Let me know how you want to proceed.
"""

# ---------------------------------------------------------------------------
# Tells. The strongest current tells go, whatever else happens.
# ---------------------------------------------------------------------------

[[case]]
id = "tells-closers-and-contrast"
kind = "tells"
request = "verve this:"
must_survive_any_case = ["caching", "repeat work", "retries", "outages"]
must_go = ["real win", "not just", "Let that sink in"]
max_loss = 0.75
max_gain = 0.5
why = "The two tells current models lean on hardest: a contrast against something nobody claimed, and a one-line closer that restates the paragraph before it. Both have to go on one sighting, and the two claims they decorate have to stay."
text = """
Caching isn't just a speed trick, it's a strategy. It cuts repeat work.

That's the real win.

Retries hide brief outages from the user.

That's the real win. Let that sink in.
"""

[[case]]
id = "tells-performed-candour"
kind = "tells"
request = "verve this:"
must_survive = ["£1,200", "£1,450", "Brennan's"]
must_survive_any_case = ["two days", "five"]
must_go = [
  "worth being precise",
  "the honest answer",
  "let me break this down",
  "to be clear",
]
must_not_match = [
  # The certificate reworded is the same certificate. A 2026-09-24 baseline
  # run turned "It's worth being precise here" into "so to put it
  # precisely:", which passed every phrase in must_go.
  '\bprecise(?:ly)?\b',
]
max_loss = 0.7
max_gain = 0.5
why = "Performed rigour and staged candour: the writer announces that they are being careful or honest instead of being it. None of these was in verve's catalogue before September 2026, and a model that has been told to strip tells will happily keep all four. The figures and the delivery times are what the reader acts on."
text = """
It's worth being precise here, because this gets repeated a lot. To be clear, \
the honest answer is that Brennan's delivers in two days and the old supplier \
took five. Let me break this down: delivery is faster, and the cost is £1,200 \
a month against £1,450.
"""

# ---------------------------------------------------------------------------
# Voice. Putting a person back never means inventing one.
# ---------------------------------------------------------------------------

[[case]]
id = "voice-no-invented-experience"
kind = "voice"
request = "verve this and make it sound more human:"
must_survive = ["1982", "520", "125", "200"]
must_go = ["testament", "pivotal"]
must_not_match = [
  # Reference prose with no writer in it. A first person here is an invented
  # witness, which is the commonest way humanising goes wrong: it makes text
  # sound more human by making it less true.
  '(?-i:\bI\b)|\bmy\b|\bme\b|\bwe\b|\bour\b',
]
max_loss = 0.5
max_gain = 0.6
why = "Over-correction. 'Make it sound more human' tempts a rewrite to add a narrator - I remember, when I visited - and that is invention under constraint 3, however natural it reads. Reference text stays neutral: neutral is the human voice for an encyclopedia entry. The Chinese fork of humanizer names this the new AI tell; faking a person is how a humaniser gets caught."
text = """
The Thames Barrier, completed in 1982, stands as a pivotal testament to \
British engineering. Spanning 520 metres across the river, it protects 125 \
square kilometres of central London from tidal surges, and it has been \
closed more than 200 times.
"""

# ---------------------------------------------------------------------------
# Detect. Asked what gives text away, name it and quote it. No score, no
# rewrite.
# ---------------------------------------------------------------------------

[[case]]
id = "detect-names-and-quotes-no-score"
kind = "detect"
request = "does this read as AI-written? Don't rewrite it, just tell me what gives it away:"
must_match = [
  # Every flag carries a quote from the text. At least one of the plainest
  # tells has to be quoted back.
  'testament|pivotal|not just|vibrant|seamless',
]
must_not_match = [
  # No probability. A percentage is a guess dressed as a measurement, and it
  # is the first step towards tuning text against a classifier.
  '\b\d{1,3}\s?%',
  '\b(?:probability|likelihood|confidence score|ai score)\b',
]
why = "Detect mode. Somebody asking whether a draft reads as AI wants the evidence, quoted, so they can judge it themselves - not a rewrite they did not ask for, and never a percentage, which is a guess presented as a measurement and the first step towards detector evasion."
text = """
In today's fast-paced digital landscape, our platform isn't just a tool - \
it's a partner. It stands as a testament to our pivotal commitment to \
seamless, vibrant collaboration, empowering teams to unlock their full \
potential.
"""

# ---------------------------------------------------------------------------
# First contact. Long cold email is flagged, never cut.
# ---------------------------------------------------------------------------

[[case]]
id = "contact-first-contact-length-flag"
kind = "contact"
request = "verve this - it's a first email to a founder I have never written to:"
must_survive = ["Orla", "ScentVerdict", "2,400"]
must_match = [
  # The note fired. Heading wording is fixed by SKILL.md's Output section.
  '(?m)^First contact \(not cut\):',
]
must_go = ["I hope this email finds you well", "delve", "reach out"]
max_loss = 0.5
why = "A stranger's first email costs the reader more per word than a reply does, and a long one is usually long because the story interested the writer. The flag names the overrun and where a link could carry the detail. It never cuts: the content is the writer's."
text = """
Dear Orla,

I hope this email finds you well. My name is Dan and I run ScentVerdict, a \
fragrance review site that I started last year after getting frustrated with \
how hard it was to find honest reviews of niche perfumes.

We delve deep into every fragrance we cover. Each review is based on at least \
two weeks of wear, and we score longevity, projection and value separately, \
because a single star rating hides too much. Over the last twelve months we \
have published 2,400 reviews, and our readers tell us the separate scores are \
the reason they come back.

I have been following your house for a while and I think your approach to \
small-batch releases is exactly the kind of story our readers care about. I \
would love to review your autumn collection, and I would be happy to share \
our methodology in more detail, including how we handle samples, how we \
disclose free products, and how we make sure the review is independent of any \
commercial relationship.

We also run a monthly newsletter that goes to our most engaged readers, and \
we have a small but growing presence on Instagram and TikTok, where short \
wear-test videos have done particularly well.

Please do reach out if this sounds interesting. I would be delighted to set \
up a call at a time that suits you.

Kind regards,
Dan
"""
